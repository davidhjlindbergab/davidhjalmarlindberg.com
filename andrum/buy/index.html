<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buy Andrum</title>
<meta name="robots" content="noindex">
<!--
  A fixed address for the checkout: Andrum's Buy button, e-mails and links in posts point here, so
  the checkout can change (another store, another link) without a new Andrum. The checkout link is
  also in ../assets/js/store.js: change both together.
-->
<link rel="canonical" href="https://davidhjalmarlindberg.com/andrum/">
<link rel="icon" href="../assets/img/andrum-icon-32.png" sizes="32x32" type="image/png">
<style>
  html { background: #04060a; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #9aa3b4; }
  p { margin: 0 24px; text-align: center; }
  a { color: #f3f5f9; }
</style>
<script>
  (function () {
    var url = "https://buy.polar.sh/polar_cl_GzJkmjeg0Qgc7hVDs9MoLwPK0VM4AX0NuDO241KhMyZ";
    var keep = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"], extra = "";
    try {
      var q = new URLSearchParams(window.location.search);
      for (var i = 0; i < keep.length; i++) {
        var v = q.get(keep[i]);
        if (v) extra += "&" + keep[i] + "=" + encodeURIComponent(v.slice(0, 120));
      }
    } catch (e) { /* the plain link is fine */ }
    window.location.replace(url + "?theme=dark" + extra);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://buy.polar.sh/polar_cl_GzJkmjeg0Qgc7hVDs9MoLwPK0VM4AX0NuDO241KhMyZ"></noscript>
</head>
<body>
<p>Opening the checkout… If nothing happens, <a href="https://buy.polar.sh/polar_cl_GzJkmjeg0Qgc7hVDs9MoLwPK0VM4AX0NuDO241KhMyZ">continue to the checkout</a>.</p>
</body>
</html>
